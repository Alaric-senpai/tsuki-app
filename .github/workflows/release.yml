name: Release

on:
  workflow_dispatch:
    inputs:
      skip_ci_check:
        description: "Allow publishing even if CI has not passed (emergency only)"
        type: boolean
        default: false
      tag:
        description: "Release tag to publish (e.g. v1.1.2)"
        type: string
        required: true
        default: "v1.1.2"
  push:
    tags:
      - "v*"

# main is production: a tag is only published after the CI workflow (including
# the aggregate "All checks" gate) has passed on that exact commit.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify-ci:
    name: Verify CI passed for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a successful CI run
        if: github.event_name != 'workflow_dispatch' || inputs.skip_ci_check == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # The check-runs list endpoint is per commit, not a `head_sha` query.
          # Accept any successful "All checks" run for this exact commit: a tag
          # push creates a newer, still-queued run whose conclusion is null.
          passed=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "All checks" and .conclusion == "success")] | length')
          if [ "$passed" = "0" ]; then
            echo "CI's 'All checks' gate has not passed for ${COMMIT_SHA}."
            echo "Merge a PR into main (or re-run CI) before publishing a release."
            exit 1
          fi
          echo "CI passed for ${COMMIT_SHA}."

  publish-tauri:
    needs: verify-ci
    permissions:
      contents: write
    defaults:
      run:
        # The Tauri app lives in dstauri/ inside the Donghua-stream repo.
        working-directory: dstauri
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Windows"
            platform: "windows-latest"
            args: "--bundles nsis"
            assetPattern: "[name]-[version]-[platform]-[arch][setup][ext]"
            uploadPlainBinary: false
            portableUpload: true
          # macOS/darwin builds are intentionally skipped for now.
          - name: "Linux"
            platform: "ubuntu-22.04"
            args: "--bundles appimage,deb,rpm"
            assetPattern: "[name]-[version]-[platform]-[arch][setup][ext]"
            uploadPlainBinary: false
            portableUpload: false
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Use Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: dstauri/src-tauri -> target

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: bun install

      - name: Read release notes
        id: notes
        run: |
          {
            echo "body<<CHANGELOG_EOF"
            cat "$GITHUB_WORKSPACE/CHANGELOG.md"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish
        id: tauri
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: dstauri
          # Follow the pushed tag so hotfix tags (e.g. v1.1.1-hotfix.1)
          # publish their own release without retagging the original one.
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseBody: |
            ${{ steps.notes.outputs.body }}

            See the assets below to download this version.
            The Windows portable executable requires the Microsoft Edge WebView2 Runtime.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: false
          retryAttempts: 2
          args: ${{ matrix.args }}
          releaseAssetNamePattern: ${{ matrix.assetPattern }}
          uploadPlainBinary: ${{ matrix.uploadPlainBinary }}
          uploadUpdaterJson: false

      - name: Upload Windows portable executable
        if: matrix.portableUpload
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $config = Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json
          $metadata = cargo metadata --manifest-path "src-tauri/Cargo.toml" --no-deps --format-version 1 | ConvertFrom-Json
          $binaryTarget = $metadata.packages[0].targets |
            Where-Object { $_.kind -contains "bin" } |
            Select-Object -First 1

          if (-not $binaryTarget) {
            throw "Could not determine the Windows binary target from Cargo metadata."
          }

          $binaryPath = Join-Path "src-tauri/target/release" "$($binaryTarget.name).exe"
          if (-not (Test-Path -LiteralPath $binaryPath)) {
            throw "Portable executable was not found at $binaryPath."
          }

          $safeProductName = ($config.productName -replace '[^A-Za-z0-9._-]+', '-').Trim('-')
          $version = "${{ steps.tauri.outputs.appVersion }}"
          $assetName = "$safeProductName-$version-windows-x64-portable.exe"
          $assetPath = Join-Path $env:RUNNER_TEMP $assetName

          Copy-Item -LiteralPath $binaryPath -Destination $assetPath
          gh release upload "v$version" $assetPath --clobber

      - name: Release summary
        if: steps.tauri.outputs.releaseHtmlUrl != ''
        shell: bash
        run: |
          {
            echo "## Tauri Release"
            echo ""
            echo "- Platform: \`${{ matrix.name }}\`"
            echo "- Version: \`${{ steps.tauri.outputs.appVersion }}\`"
            echo "- Release: ${{ steps.tauri.outputs.releaseHtmlUrl }}"
            echo "- Artifacts: \`${{ steps.tauri.outputs.artifactPaths }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
