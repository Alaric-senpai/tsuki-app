name: CI

on:
  push:
    branches: [main, master, "1.1.2"]
  pull_request:
    branches: [main, master, "1.1.2"]
  workflow_dispatch:

# Only the newest run per branch/PR matters; superseded runs waste runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dstauri/src-tauri
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dstauri/src-tauri -> target
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Cache bundled sidecars
        uses: actions/cache@v4
        with:
          path: dstauri/src-tauri/binaries
          key: sidecars-${{ runner.os }}-${{ hashFiles('dstauri/scripts/fetch-sidecars.sh') }}
      # tauri-build fails outright when an externalBin is missing, and the binaries
      # are gitignored, so they must be fetched before any cargo command runs.
      - name: Fetch sidecars
        working-directory: dstauri
        run: bash scripts/fetch-sidecars.sh
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test

  frontend:
    name: Frontend gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dstauri
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('dstauri/bun.lock*') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: typecheck
        run: bun run typecheck
      - name: test
        run: bun run test
      - name: lint
        run: bun run lint
      - name: build (static export)
        run: bun run build

  # A single required check for branch protection: require "All checks" on
  # main (and 1.1.2) instead of maintaining a list of per-job names.
  all-checks:
    name: All checks
    if: always()
    needs: [rust, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all gates passed
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          if [ "$RUST_RESULT" != "success" ] || [ "$FRONTEND_RESULT" != "success" ]; then
            echo "Rust gates: $RUST_RESULT; frontend gates: $FRONTEND_RESULT"
            exit 1
          fi
          echo "All gates passed."
